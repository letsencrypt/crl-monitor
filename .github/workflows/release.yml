# Run the release flow
# Keep in sync with try-release.yml

name: Run release
on:
  push:
    tags:
      - v*

permissions:
  contents: read
  id-token: write # Needed to request JWT for OIDC

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: ./build-release.sh
      # Upload to S3:
      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: arn:aws:iam::338276578713:role/crl-monitor-github-action-role
          aws-region: us-west-2
      - run: aws s3 cp build/checker.zip s3://crl-monitor-artifacts/${GITHUB_REF_NAME}/
      - run: aws s3 cp build/churner.zip s3://crl-monitor-artifacts/${GITHUB_REF_NAME}/
