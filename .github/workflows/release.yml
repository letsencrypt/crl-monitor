# Run the release flow
# Keep in sync with try-release.yml

name: Run release
on:
  push:
    tags:
      - v*

permissions:
  contents: read
  id-token: write # Needed to request JWT for OIDC

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: ./build-release.sh
      # Upload to S3:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::338276578713:role/crl-monitor-github-action-role
          aws-region: us-west-2
      - run: aws s3 cp build/checker.zip s3://crl-monitor-artifacts/${GITHUB_REF_NAME}/
      - run: aws s3 cp build/churner.zip s3://crl-monitor-artifacts/${GITHUB_REF_NAME}/
